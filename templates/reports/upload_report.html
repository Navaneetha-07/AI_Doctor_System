
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Medical Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#00a0b0;
    min-height:100vh;
}

.page-title{
    text-align:center;
    padding:30px;
    color:#000;
    font-weight:bold;
}

.report-card{
    background:azure;
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.medical-image{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:20px;
}

.form-control,
.form-select{
    border-radius:12px;
    height:50px;
}

.btn-upload{
    width:100%;
    background:#198754;
    color:white;
    height:50px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
}

.form-control,
.form-select{
    border-radius:12px;
    padding:12px;
    border:1px solid #ced4da;
}

.form-control:focus,
.form-select:focus{
    box-shadow:0 0 10px rgba(13,110,253,.25);
    border-color:#0d6efd;
}

.report-card{
    background:azure;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

</style>

</head>

<body>

<div class="container">

<h1 class="page-title">
🏥 Upload Medical Report
</h1>

<div class="row">

<div class="col-md-6">

<img
src="https://images.unsplash.com/photo-1576091160550-2173dba999ef?w=1000"
class="medical-image">

</div>

<div class="col-md-6">

<div class="report-card">

<h3 class="text-primary mb-4">
Patient Report Form
</h3>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

{{ form.as_p }}

<button type="submit" class="btn-upload">
Upload Report
</button>

</form>

</div>

</div>

</div>

</div>

</body>
</html>

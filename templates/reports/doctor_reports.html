
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doctor Reports</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:azure;
}

.header{
    background:#0d6efd;
    color:white;
    padding:25px;
    text-align:center;
}

.stats-card{
    background:white;
    border-radius:15px;
    padding:20px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.table-container{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.badge-doctor{
    background:#0d6efd;
    color:white;
    padding:8px 12px;
    border-radius:20px;
}

</style>

</head>

<body>

<div class="header">

<h1>
🏥 Doctor Reports Dashboard
</h1>

<p>
Manage Medical Reports Efficiently
</p>

</div>

<div class="container mt-5">

<div class="row mb-4">

<div class="col-md-4">
<div class="stats-card">
<h2>{{ reports.count }}</h2>
<p>Total Reports</p>
</div>
</div>

<div class="col-md-4">
<div class="stats-card">
<h2>4</h2>
<p>Available Doctors</p>
</div>
</div>

<div class="col-md-4">
<div class="stats-card">
<h2>100%</h2>
<p>Secure Storage</p>
</div>
</div>

</div>

<div class="table-container">

<h3 class="mb-4">
Patient Reports
</h3>

<table class="table table-hover">

<thead>

<tr>

<th>Patient Name</th>
<th>Doctor</th>
<th>Report File</th>

</tr>

</thead>

<tbody>

{% for report in reports %}

<tr>

<td>
{{ report.patient_name }}
</td>

<td>
<span class="badge-doctor">
{{ report.doctor.name }}
</span>
</td>

<td>

<a
href="{{ report.report_file.url }}"
class="btn btn-success btn-sm">

Download

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>
</html>

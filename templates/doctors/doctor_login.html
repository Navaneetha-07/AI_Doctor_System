<!DOCTYPE html>
<html>

<head>

<title>Doctor Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#00a0b0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    background:azure;
    width:500px;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:black;
    font-weight:bold;
}

.btn-login{
    width:100%;
    background:#198754;
    color:white;
    height:50px;
    border:none;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="login-card">

<h1>👨‍⚕️ Doctor Portal</h1>

<br>
{% if error %}
<div class="alert alert-danger text-center">
    {{ error }}
</div>
{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="text"
name="username"
class="form-control mb-3"
placeholder="Enter Doctor Username">

<input
type="password"
name="password"
class="form-control mb-3"
placeholder="Enter Password">

<button
type="submit"
class="btn-login">

Doctor Login

</button>

</form>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Doctor Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:#00a0b0;
}

.login-card{

    width:500px;
    background:azure;

    padding:50px;

    border-radius:25px;

    box-shadow:0 15px 40px rgba(0,0,0,0.15);

}

.logo{

    text-align:center;
    font-size:60px;

}

h1{

    text-align:center;
    color:#000000;
    margin-top:10px;

}

.subtitle{

    text-align:center;
    color:#666;
    margin-bottom:35px;

}

.form-label{

    font-weight:600;

}

.form-control{

    height:55px;

    border-radius:12px;

}

.form-control:focus{

    border-color:#0d6efd;

    box-shadow:0 0 10px rgba(13,110,253,.2);

}

.login-btn{

    width:100%;

    height:55px;

    border:none;

    border-radius:12px;

    background:#0d6efd;

    color:white;

    font-size:20px;

    font-weight:bold;

}

.login-btn:hover{

    background:#0b5ed7;

}

.register-link{

    text-align:center;
    margin-top:25px;

}

.register-link a{

    text-decoration:none;
    font-weight:bold;

}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">
🏥
</div>

<h1>AI Doctor System</h1>

<p class="subtitle">
Login to access your medical reports
</p>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">
Username
</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter your username"
required>

</div>

<div class="mb-4">

<label class="form-label">
Password
</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter your password"
required>

</div>

<button type="submit" class="login-btn">

Login

</button>

</form>

<div class="register-link">

Don't have an account?

<a href="/register/">

Register

</a>

</div>

</div>

</body>

</html>

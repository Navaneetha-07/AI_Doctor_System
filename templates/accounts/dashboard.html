<!DOCTYPE html>
<html>
<head>
    <title>AI Doctor Report Sharing System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#00a0b0;
            min-height:100vh;
        }

        .hero{
            padding:60px 20px;
            text-align:center;
            color:white;
        }

        .card{
            border:none;
            border-radius:20px;
            transition:0.3s;
            box-shadow:0px 5px 20px rgba(0,0,0,0.2);
        }

        .card:hover{
            transform:translateY(-10px);
        }

        .doctor-img{
            height:180px;
            object-fit:cover;
            border-radius:20px 20px 0 0;
        }

        .feature-box{
            background:white;
            padding:20px;
            border-radius:15px;
            margin-top:20px;
        }

        .btn-custom{
            padding:12px 25px;
            font-size:18px;
            border-radius:30px;
        }

    </style>

</head>

<body>

<div class="hero">

    <h1>🏥 AI Doctor Report Sharing System</h1>

    <p>
        Upload Medical Reports and Share Them With Doctors Instantly
    </p>

    <a href="/upload-report/" class="btn btn-warning btn-custom">
        Upload Report
    </a>

    <a href="/doctor-reports/" class="btn btn-success btn-custom">
        View Reports
    </a>

</div>

<div class="container">

    <div class="feature-box">

        <h2 class="text-center mb-4">
            Our Specialist Doctors
        </h2>

        <div class="row">

            <div class="col-md-3 mb-4">

                <div class="card">

                    <img src="https://images.unsplash.com/photo-1612349317150-e413f6a5b16d"
                         class="doctor-img">

                    <div class="card-body text-center">

                        <h5>Dr Ramesh</h5>

                        <p>Cardiologist</p>

                    </div>

                </div>

            </div>

            <div class="col-md-3 mb-4">

                <div class="card">

                    <img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2"
                         class="doctor-img">

                    <div class="card-body text-center">

                        <h5>Dr Anjali</h5>

                        <p>Neurologist</p>

                    </div>

                </div>

            </div>

            <div class="col-md-3 mb-4">

                <div class="card">

                    <img src="https://images.unsplash.com/photo-1594824476967-48c8b964273f"
                         class="doctor-img">

                    <div class="card-body text-center">

                        <h5>Dr Priya</h5>

                        <p>Pediatrician</p>

                    </div>

                </div>

            </div>

            <div class="col-md-3 mb-4">

                <div class="card">

                    <img src="https://images.unsplash.com/photo-1582750433449-648ed127bb54"
                         class="doctor-img">

                    <div class="card-body text-center">

                        <h5>Dr Kumar</h5>

                        <p>Orthopedic</p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Doctor Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#00a0b0;
    font-family:'Segoe UI',sans-serif;
}

.register-container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-card{
    width:500px;
    background:azure;
    padding:40px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.15);
}

.icon{
    font-size:55px;
    text-align:center;
}

.register-card h1{
    text-align:center;
    color:#000000;
    margin-bottom:10px;
}

.register-card p{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

.form-control{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

.form-control:focus{
    outline:none;
    border-color:#0d6efd;
    box-shadow:0 0 10px rgba(13,110,253,0.2);
}

.register-btn{
    width:100%;
    padding:15px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn:hover{
    background:#0b5ed7;
}

.login-link{
    text-align:center;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="register-container">

    <div class="register-card">

        <div class="icon">
            🏥
        </div>

        <h1>AI Doctor System</h1>

        <p>Create your patient account</p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text"
                       name="username"
                       placeholder="Enter your username"
                       class="form-control">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       name="email"
                       placeholder="Enter your email address"
                       class="form-control">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password"
                       name="password"
                       placeholder="Enter your password"
                       class="form-control">
            </div>

            <button type="submit" class="register-btn">
                Register Now
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login/">Login</a>
        </div>

    </div>

</div>



</body>
</html>
